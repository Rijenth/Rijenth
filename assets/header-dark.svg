<svg xmlns="http://www.w3.org/2000/svg" width="640" height="148" viewBox="0 0 640 148">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 22px; font-weight: 600; fill: #e6edf3; }
    .stack { font-size: 15px; fill: #8d96a0; }
    .cursor { fill: #58a6ff; }

    /* État de repos = état final : c'est lui qui s'affiche si les animations sont désactivées */
    .name { animation: type 2.24s steps(32) 0.4s backwards; }
    .cursor { transform: translateX(416px); animation: caret 2.24s steps(32) 0.4s backwards, blink 1.1s step-end 2.64s infinite; }
    .stack { animation: fade 0.6s ease-out 2.8s backwards; }

    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes caret { from { transform: translateX(0); } to { transform: translateX(416px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- textLength fixe la chasse à 13 px par caractère : chaque pas de frappe révèle un caractère -->
  <text class="name" x="112" y="40" textLength="416" lengthAdjust="spacing">Rijenth — développeur full-stack</text>
  <rect class="cursor" x="112" y="21" width="3" height="24"/>

  <g class="stack" text-anchor="middle">
    <text x="320" y="84">PHP · Laravel · Python · Go</text>
    <text x="320" y="108">TypeScript · Vue · Nuxt · React</text>
    <text x="320" y="132">PostgreSQL · Redis · Docker</text>
  </g>
</svg>
